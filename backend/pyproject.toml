[project]
name = "once-backend"
version = "0.1.0"
description = "ONCE — multimodal personal skill-memory backend (FastAPI + DynamoDB + S3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "botocore[crt]>=1.43.116",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]
# AWS data-layer dependencies only; inference is a separate, explicitly selected provider.
